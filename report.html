<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>성과 입력 | 천연나노융합사업단</title>
  <script>try{var p=JSON.parse(localStorage.getItem('n2c-prefs')||'{}');if(p.theme)document.documentElement.dataset.theme=p.theme}catch(e){}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="img/n2c-mark.png" alt="N2C" width="66" height="40">
      <span class="brand-text"><strong>천연나노융합사업단</strong><small>성과 입력</small></span>
    </a>
    <div class="header-tools">
      <button class="tool-btn theme-btn" type="button" aria-label="화면 밝기">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap admin-main">

  <section class="gate" id="gate">
    <p class="msg">불러오는 중…</p>
  </section>

  <div id="app" hidden>
    <div class="report-head">
      <h1 id="who">성과 입력</h1>
      <p class="hint">2026 글로컬랩 사업 보고에 쓸 성과를 넣어 주세요. 저장하면 바로 사업단에 전달돼요. 넣은 내용은 본인과 사업단 관리자만 볼 수 있어요. 이 링크는 본인 전용이에요. 즐겨찾기 해 두면 다음에도 바로 들어올 수 있어요.</p>
    </div>
    <div class="report-body">
    <nav class="side-tabs" id="catTabs" aria-label="항목"></nav>
    <section class="panel-box">
      <div class="toolbar">
        <p class="hint report-rule" id="catRule"></p>
        <button class="btn-s primary" type="button" id="addBtn">추가</button>
      </div>
      <table class="table report-list">
        <tbody id="itemRows"></tbody>
      </table>
    </section>
    </div>
  </div>
</main>

<!-- 실적 넣기·고치기 -->
<dialog id="itemDialog" class="wide">
  <form method="dialog" id="itemForm">
    <h2 id="itemDialogTitle">추가</h2>
    <div class="grid-2" id="itemFields"></div>
    <div class="actions">
      <button class="btn-s danger" type="button" id="deleteItemBtn">삭제</button>
      <span class="spacer"></span>
      <button class="btn-s" value="cancel" formnovalidate>취소</button>
      <button class="btn-s primary" type="submit" value="save">저장</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="js/main.js"></script>
<script type="module" src="js/report.js"></script>
</body>
</html>
